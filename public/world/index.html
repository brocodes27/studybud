<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ElevenFolks — the world of STEM mastery</title>
  <meta name="description" content="Scroll to fly through the ElevenFolks world: ingest anything, teach it back, plan it, prove it." />
  <style>
    /* Theme tokens. --sw-bg matches the scene background hex used in every image prompt. */
    :root, .sw-root {
      --sw-bg: #FAF8F5;
      --sw-ink: #2D2A26;
      --sw-ink-soft: #8A8279;
      --sw-accent: #8B7355;
    }
    html, body { margin: 0; background: var(--sw-bg); }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'ElevenFolks', href: '#top' },
      cta: { label: 'Start free', href: '/auth' },
      hint: 'scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'syow', label: 'Ingest',
          still: 'assets/syow.png',        stillMobile: 'assets/syow-m.png',
          clip:  'assets/vid/syow.mp4',    clipMobile:  'assets/vid/syow-m.mp4',
          accent: '#B8956A',
          scroll: 1.5, linger: 0.35,
          eyebrow: 'Study your own way',
          title: 'Feed it anything.',
          body: 'PDFs, lecture links, YouTube, your own scrawled notes — they come out the other side as ordered study units.',
          tags: ['PDF', 'Web', 'YouTube'],
        },
        {
          id: 'atlas', label: 'ATLAS',
          still: 'assets/atlas.png',       stillMobile: 'assets/atlas-m.png',
          clip:  'assets/vid/atlas.mp4',   clipMobile:  'assets/vid/atlas-m.mp4',
          accent: '#8B7355',
          eyebrow: 'Your AI study partner',
          title: 'ATLAS remembers everything.',
          body: 'A persistent companion that knows your subjects, your history and every gap you left open last week.',
          tags: ['Voice', 'Step-by-step', 'Context-aware'],
        },
        {
          id: 'feynman', label: 'Feynman',
          still: 'assets/feynman.png',     stillMobile: 'assets/feynman-m.png',
          clip:  'assets/vid/feynman.mp4', clipMobile:  'assets/vid/feynman-m.mp4',
          accent: '#6B8E6B',
          scroll: 1.5, linger: 0.4,
          eyebrow: 'The Feynman protocol',
          title: 'You teach. It listens.',
          body: 'ATLAS plays the pupil and asks the naive question that finds the hole in your explanation.',
          tags: ['Explain-back', 'Gap detection'],
        },
        {
          id: 'planner', label: 'Planner',
          still: 'assets/planner.png',     stillMobile: 'assets/planner-m.png',
          clip:  'assets/vid/planner.mp4', clipMobile:  'assets/vid/planner-m.mp4',
          accent: '#C4A484',
          eyebrow: 'Neural planner',
          title: 'A year, mapped to today.',
          body: 'One exam date in, a living roadmap out — re-cut every morning around what you actually finished.',
          tags: ['SAT / AP / JEE', 'Daily missions'],
        },
        {
          id: 'simulator', label: 'Simulators',
          still: 'assets/simulator.png',     stillMobile: 'assets/simulator-m.png',
          clip:  'assets/vid/simulator.mp4', clipMobile:  'assets/vid/simulator-m.mp4',
          accent: '#B87B6B',
          eyebrow: 'Exam simulators',
          title: 'Exam day, on repeat.',
          body: 'Adaptive papers that get harder where you are strong and stay put where you are not.',
          tags: ['Adaptive', 'Per-mistake feedback'],
        },
        {
          id: 'mastery', label: 'Mastery',
          still: 'assets/mastery.png',     stillMobile: 'assets/mastery-m.png',
          clip:  'assets/vid/mastery.mp4', clipMobile:  'assets/vid/mastery-m.mp4',
          accent: '#7A6B8A',
          scroll: 1.7, linger: 0.5,
          eyebrow: 'And it all grows into',
          title: 'Mastery you can point at.',
          body: 'Every unit you closed, every concept you taught back, standing in one tree you own.',
          tags: [],
          cta: {
            primary:   { label: 'Start free', href: '/auth' },
            secondary: { label: 'See a demo', href: '/demo' },
          },
        },
      ],
      // length === sections.length - 1
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4',
        'assets/vid/conn3.mp4',
        'assets/vid/conn4.mp4',
        'assets/vid/conn5.mp4',
      ],
      connectorsMobile: [
        'assets/vid/conn1-m.mp4',
        'assets/vid/conn2-m.mp4',
        'assets/vid/conn3-m.mp4',
        'assets/vid/conn4-m.mp4',
        'assets/vid/conn5-m.mp4',
      ],
    });
  </script>
</body>
</html>
