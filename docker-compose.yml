services:
  video-gen-server:
    build: .
    container_name: video-gen-server
    ports:
      - "3001:3001"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - VITE_OPENAI_API_KEY=${VITE_OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persist generated videos
      - ./public/videos:/app/public/videos
      # Map logs/temp storage if needed, but code can stay in container or be mapped
      - ./manim_engine:/app/manim_engine
